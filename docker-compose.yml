version: '3.9'

services:

  nginx:
    image: nginx:latest
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - booking-service
      - search-service
      - mongo
    restart: unless-stopped
    environment:
      HOTEL_MONGO_URI: mongodb://mongo:27017/hoteldb

  mongo:
    image: mongo:7
    container_name: hotel-mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./user-service
    container_name: user-service
    expose:
      - "3000"

  booking-service:
    build: ./booking-service
    container_name: booking-service
    expose:
      - "4000"

  search-service:
    build: ./search-service
    container_name: search-service
    expose:
      - "5000"

volumes:
  mongo_data: