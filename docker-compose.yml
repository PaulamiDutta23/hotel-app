version: "3.9"

services:
  server:
    build: .
#    container_name: hotel-app
    deploy:
      replicas: 3
    environment:
      HOTEL_MONGO_URI: mongodb://mongo:27017/hoteldb
    depends_on:
      - mongo
    networks:
      - backend


  mongo:
    image: mongo:7
    container_name: hotel-mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  nginx:
    image : nginx:latest
    container_name: nginx_proxy

    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
